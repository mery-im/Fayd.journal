<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فيض — مفكرة التدبر</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeadb;--ui:#fffdf5;--ink:#244a3a;--mut:#6d7a70;--gold:#b98f35;--line:#d8ccab;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171d19;--ui:#222a25;--ink:#d3e8dc;--mut:#9aaba0;--gold:#d3ab55;--line:#38443d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171d19;--ui:#222a25;--ink:#d3e8dc;--mut:#9aaba0;--gold:#d3ab55;--line:#38443d;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri','Noto Naskh Arabic',serif;font-size:17px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ui);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ui);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 10px}
header .sp{flex:1}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.on{background:var(--ink);color:var(--ui);border-color:var(--ink)}
#pg{color:var(--mut);min-width:54px}
main{padding:12px 10px 150px}
.hint{max-width:560px;margin:0 auto 12px;color:var(--mut);font-size:15px;text-align:center}
.pg{position:relative;width:min(100%,560px);margin:0 auto 16px;aspect-ratio:720/1019;background:#faf6ec;box-shadow:0 2px 16px rgba(0,0,0,.22);overflow:hidden;border-radius:3px}
.bg,.cv{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#doc[data-tool="pen"] .cv,#doc[data-tool="erase"] .cv{touch-action:none;cursor:crosshair}
.z,.t{position:absolute;color:#244a3a;font-family:'Amiri',serif}
.z{background:transparent;border:0;border-radius:4px;padding:0 4px;direction:rtl;pointer-events:none;resize:none;overflow:hidden}
.z.ln{font-size:calc(var(--u)*3.6)}
.z.ttl{font-size:calc(var(--u)*3.4);font-weight:700;text-align:center}
.z.nm{font-size:calc(var(--u)*5);text-align:center}
.z.ta{font-size:calc(var(--u)*3.2);text-align:center;line-height:1.5;padding-top:4px}
.z:focus{background:rgba(255,255,255,.7)}
#doc[data-tool="hand"] .z,#doc[data-tool="text"] .z{pointer-events:auto}
#doc[data-tool="text"] .z:not(:focus){box-shadow:0 0 0 1px rgba(185,143,53,.55) inset}
.t{min-width:12%;pointer-events:none}
.t .e{outline:none;line-height:1.7;font-size:calc(var(--u)*4.2);padding:0 3px;white-space:pre-wrap;word-break:break-word;min-height:1.7em}
#doc[data-tool="hand"] .t,#doc[data-tool="text"] .t{pointer-events:auto}
#doc[data-tool="text"] .t{outline:1px dashed var(--gold)}
.h,.dx{display:none;position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;color:#fff;text-align:center;line-height:28px;font:15px sans-serif;touch-action:none;user-select:none}
.h{left:-8px;background:#b98f35;cursor:grab}.dx{left:26px;background:#a23d3d;cursor:pointer}
#doc[data-tool="text"] .h,#doc[data-tool="text"] .dx{display:block}
nav{position:fixed;inset:auto 0 0;z-index:9;background:var(--ui);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ui) inset}
input[type=range]{width:80px;accent-color:var(--gold)}
</style>
</head>
<body>
<header>
  <span id="pg"></span>
  <span class="sp"></span>
  <button id="addBox">+ صناديق</button>
  <button id="addFree">+ صفحة حرة</button>
</header>
<main>
  <p class="hint">مرّر للأسفل لتتصفح الصفحات. اضغط على أي سطر أو عنوان لتكتب فيه. اختر «قلم» للكتابة اليدوية، وبعدها «تمرير» للتنقل.</p>
  <div id="doc" data-tool="hand"></div>
</main>
<nav>
  <button id="tHand" class="on">تمرير</button>
  <button id="tPen">قلم</button>
  <button id="tTx">نص</button>
  <button id="tEr">ممحاة</button>
  <button id="undo">تراجع</button>
  <button id="clr">مسح الصفحة</button>
  <span id="cols"></span>
  <input id="sz" type="range" min="2" max="14" value="4" aria-label="سماكة القلم">
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const PAGEOF={cover:1,ded:2,boxes:3,free:4};
const PDFJS=window.pdfjsLib||window["pdfjs-dist/build/pdf"];
let pdf=null;
const _IMG={cover:"__COVER__",ded:"__DED__",boxes:"__BOXES__",free:"__FREE__"};
const W=720,H=1019,KEY="fayd-notebook-v1",COLORS=["#244a3a","#8a6a1f","#6b4c9a","#222222"];
const L=(p,x1,x2,ys)=>ys.map((y,i)=>({id:p+i,x:x1,y:y-34,w:x2-x1,h:34,k:"ln"}));
const T=(id,x,y,w,h)=>({id,x,y,w,h,k:"ttl"});
const ZONES={
  ded:[{id:"name",x:178,y:451,w:317,h:44,k:"nm"}],
  free:[T("sr",316,108,88,34)],
  boxes:[
    T("t1",100,46,190,34),...L("a",54,296,[118,175,229,283,340]),
    T("t2",425,49,175,34),...L("b",402,674,[118,182,262,324]),
    T("t3",552,414,103,34),...L("c",538,676,[489,527,563,606]),
    T("t4",130,664,160,34),...L("d",54,300,[742,798,852,906]),
    T("t5",415,706,195,36),...L("e",400,668,[787,845,904]),
    T("sr",268,582,184,40),
    {id:"v",x:285,y:450,w:150,h:92,k:"ta"}
  ]
};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.pages)){S={pages:["cover","ded","boxes","free"].map(t=>({t,s:[],x:[],z:{}}))}}
let tool="hand",color=COLORS[0],timer=null,cur=0,last=0,PG=[],live=null,armed=null;
const $=id=>document.getElementById(id),doc=$("doc");
const mk=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},300)}
function stroke(ctx,s){
  ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
  ctx.globalCompositeOperation=s.e?"destination-out":"source-over";
  ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=s.w;
  const p=s.p;
  if(p.length===1){ctx.beginPath();ctx.arc(p[0][0],p[0][1],s.w/2,0,7);ctx.fill()}
  else{ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let k=1;k<p.length;k++){ctx.quadraticCurveTo(p[k-1][0],p[k-1][1],(p[k-1][0]+p[k][0])/2,(p[k-1][1]+p[k][1])/2)}ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);ctx.stroke()}
  ctx.restore();
}
function redraw(o){o.ctx.clearRect(0,0,W,H);o.p.s.forEach(s=>stroke(o.ctx,s))}
function mkZone(p,z){
  const e=mk(z.k==="ta"?"textarea":"input","z "+z.k);
  if(z.k!=="ta")e.type="text";
  e.dir="rtl";e.spellcheck=false;e.autocomplete="off";
  Object.assign(e.style,{left:z.x/W*100+"%",top:z.y/H*100+"%",width:z.w/W*100+"%",height:z.h/H*100+"%"});
  const v=p.z[z.id];if(v){e.value=v[0];e.style.color=v[1]}
  e.addEventListener("input",()=>{e.style.color=color;p.z[z.id]=[e.value,color];save()});
  return e;
}
function mkTx(o,t){
  const d=mk("div","t"),e=mk("div","e"),h=mk("span","h"),x=mk("span","dx");
  e.contentEditable="true";e.dir="rtl";e.textContent=t.v;e.style.color=t.c;
  h.textContent="✥";x.textContent="×";x.title="حذف";
  d.style.left=t.x*100+"%";d.style.top=t.y*100+"%";d.style.width=t.w*100+"%";
  d.append(e,h,x);o.tx.appendChild(d);
  const rm=()=>{const a=o.p.x,k=a.indexOf(t);if(k>-1)a.splice(k,1);d.remove();save()};
  e.addEventListener("input",()=>{t.v=e.innerText;save()});
  e.addEventListener("blur",()=>{if(!e.innerText.trim())rm()});
  x.onclick=rm;
  let sx,sy,ox,oy,on=false;
  h.addEventListener("pointerdown",ev=>{on=true;h.setPointerCapture(ev.pointerId);sx=ev.clientX;sy=ev.clientY;ox=t.x;oy=t.y;ev.preventDefault()});
  h.addEventListener("pointermove",ev=>{
    if(!on)return;const r=o.w.getBoundingClientRect();
    t.x=Math.max(0,Math.min(1-t.w,ox+(ev.clientX-sx)/r.width));t.y=Math.max(0,Math.min(0.97,oy+(ev.clientY-sy)/r.height));
    d.style.left=t.x*100+"%";d.style.top=t.y*100+"%";
  });
  const up=()=>{if(on){on=false;save()}};
  h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
  return e;
}
function build(i){
  const p=S.pages[i];p.z=p.z||{};
  const w=mk("div","pg"),bg=mk("canvas","bg"),cv=mk("canvas","cv"),tx=mk("div"),zs=mk("div");
  cv.width=W;cv.height=H;
  w.append(bg,cv,tx,zs);doc.append(w);
  const o={p,w,bg,cv,ctx:cv.getContext("2d"),tx};PG[i]=o;
  (ZONES[p.t]||[]).forEach(z=>zs.append(mkZone(p,z)));
  p.x.forEach(t=>mkTx(o,t));redraw(o);paint(o);
  const pt=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*W/r.width),Math.round((e.clientY-r.top)*H/r.height)]};
  cv.addEventListener("pointerdown",e=>{
    if(!(tool==="pen"||tool==="erase")||e.button>0)return;
    cv.setPointerCapture(e.pointerId);
    live={c:color,w:+$("sz").value*(tool==="erase"?4:1),e:tool==="erase",p:[pt(e)]};
    p.s.push(live);last=i;redraw(o);
  });
  cv.addEventListener("pointermove",e=>{
    if(!live||live!==p.s[p.s.length-1])return;
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(v=>live.p.push(pt(v)));redraw(o);
  });
  const end=()=>{if(live){live=null;save()}};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  w.addEventListener("click",e=>{
    if(tool!=="text"||e.target.closest(".t,.z"))return;
    const r=w.getBoundingClientRect(),tw=0.5;
    const t={x:Math.max(0.03,Math.min((e.clientX-r.left)/r.width,0.97-tw)),y:Math.min((e.clientY-r.top)/r.height,0.95),w:tw,c:color,v:""};
    p.x.push(t);mkTx(o,t).focus();
  });
  io.observe(w);
}
async function paint(o){
  if(!pdf)return;
  try{
    const pg=await pdf.getPage(PAGEOF[o.p.t]);
    const base=pg.getViewport({scale:1});
    const cw=Math.min(1700,Math.round((o.w.clientWidth||560)*(window.devicePixelRatio||1)*1.15));
    const v=pg.getViewport({scale:cw/base.width});
    o.bg.width=Math.round(v.width);o.bg.height=Math.round(v.height);
    await pg.render({canvasContext:o.bg.getContext("2d"),viewport:v}).promise;
  }catch(e){showErr("تعذّر عرض صفحة من المفكرة.")}
}
function showErr(m){const h=document.querySelector(".hint");h.textContent=m;h.style.color="#a23d3d"}
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){cur=PG.findIndex(o=>o.w===e.target);label()}});
},{threshold:0.5});
function label(){$("pg").textContent=(cur+1)+" / "+S.pages.length}
function fit(){if(PG[0])doc.style.setProperty("--u",PG[0].w.clientWidth/100+"px")}
function render(){doc.innerHTML="";PG=[];S.pages.forEach((_,i)=>build(i));fit();label();save()}
function add(t){S.pages.push({t,s:[],x:[],z:{}});build(S.pages.length-1);fit();label();save();PG[PG.length-1].w.scrollIntoView({behavior:"smooth",block:"start"})}
$("addBox").onclick=()=>add("boxes");$("addFree").onclick=()=>add("free");
function setTool(t){
  tool=t;doc.dataset.tool=t;
  [["tHand","hand"],["tPen","pen"],["tTx","text"],["tEr","erase"]].forEach(([id,n])=>$(id).classList.toggle("on",n===t));
}
$("tHand").onclick=()=>setTool("hand");$("tPen").onclick=()=>setTool("pen");$("tTx").onclick=()=>setTool("text");$("tEr").onclick=()=>setTool("erase");
$("undo").onclick=()=>{const o=PG[last]||PG[cur];if(!o)return;o.p.s.pop();redraw(o);save()};
$("clr").onclick=()=>{
  const b=$("clr");
  if(armed){clearTimeout(armed);armed=null;b.textContent="مسح الصفحة";const p=S.pages[cur];p.s=[];p.x=[];p.z={};const y=scrollY;render();scrollTo(0,y);return}
  b.textContent="اضغط للتأكيد";armed=setTimeout(()=>{armed=null;b.textContent="مسح الصفحة"},3000);
};
COLORS.forEach((c,k)=>{
  const b=mk("button","sw"+(k?"":" on"));b.style.background=c;b.setAttribute("aria-label","لون "+(k+1));
  b.onclick=()=>{color=c;document.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(tool==="erase")setTool("pen")};
  $("cols").appendChild(b);
});
let rt=null;
addEventListener("resize",()=>{fit();clearTimeout(rt);rt=setTimeout(()=>PG.forEach(paint),400)});
if(!PDFJS){showErr("تعذّر تحميل قارئ PDF. تأكد من اتصالك بالإنترنت.")}
else{
  PDFJS.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  PDFJS.getDocument("fayd.pdf").promise.then(d=>{pdf=d;render()}).catch(()=>{render();showErr("تعذّر تحميل ملف المفكرة fayd.pdf. تأكد أنه مرفوع بجانب index.html.")});
}
</script>
</body>
</html>
